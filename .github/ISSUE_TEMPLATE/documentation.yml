name: Documentation improvement
description: Report unclear, missing, or incorrect documentation
title: "[Docs]: "
labels:
  - "type: documentation"
  - "status: needs triage"
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link the page or name the file and section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs improvement?
      description: Explain what is missing, incorrect, or difficult to understand.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Describe or draft the improvement if you can.
    validations:
      required: false
